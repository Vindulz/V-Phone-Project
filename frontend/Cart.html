<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | V-Phone</title>
    <link rel="stylesheet" href="Cart.css">
</head>
<body>
    <div class="main">

        <div class="navbar">
            <img src="assets/phoneicon.png" class="logoimage" alt="VPhone logo">
            <h1 class="Logo">VPhone</h1>
            <div class="menu">
                <a href="homepage.html">Home</a>
                <a href="About.html">About Us</a>
                <a href="Products.html">Products</a>
                <a href="Promo.html">Promos</a>
            </div>
            <div class="nav-user">
                <a href="Cart.html" class="cart-icon-link">
                    <img src="assets/cart_Icon.png" alt="Cart">
                    <span id="nav-cart-count" class="cart-count">0</span>
                </a>
                <span id="nav-username">Hello, Guest!</span>
            </div>
        </div>

        <section class="cart-section">
            <h1>Your Cart</h1>
            <div id="cart-items" class="cart-items">
                <p id="empty-msg">Your cart is empty.</p>
            </div>
            <div class="cart-total" id="cart-total-section" style="display:none;">
                <h2>Total: <span id="cart-total">Rp. 0</span></h2>
                <button class="checkout-btn" onclick="checkout()">Checkout</button>
            </div>
        </section>

    </div>

    <footer>
        <p>Copyright © 2025 V-Phone Corporation. All Rights Reserved</p>
    </footer>

    <script src="Cart.js"></script>
    <script src="Navbar.js"></script>
</body>
</html>
